[project]
name = "ai-invite-memory"
version = "0.22.0"
description = "AI Invite · Memory — a verifiable, portable memory and persona kernel for AI companions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aiinvite = "aiinvite.cli:main"

[tool.setuptools.packages.find]
include = ["aiinvite*"]

[tool.setuptools.package-data]
"aiinvite.cn" = ["data/*.json"]
"aiinvite.recall" = ["data/*.json"]
"aiinvite.projection" = ["data/*.json"]
"aiinvite.persona" = ["data/*.json"]
"aiinvite.kernel" = ["data/*.json"]
"aiinvite.pcs" = ["data/*.json"]
