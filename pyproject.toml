[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-invite-memory"
version = "0.26.0"
description = "AI Invite · Memory — a verifiable, portable memory and persona kernel for AI companions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Calvin liu" }]
keywords = ["ai-companion", "memory", "persona", "local-first", "portable", "chinese-nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Justnewtype167/ai-invite-memory"
Documentation = "https://github.com/Justnewtype167/ai-invite-memory/blob/main/docs/INSTALL.md"
Paper = "https://github.com/Justnewtype167/ai-invite-memory/blob/main/docs/PAPER-en.md"
Changelog = "https://github.com/Justnewtype167/ai-invite-memory/blob/main/CHANGELOG.md"

[project.scripts]
aiinvite = "aiinvite.cli:main"

[tool.setuptools.packages.find]
include = ["aiinvite*"]

[tool.setuptools.package-data]
"aiinvite.cn" = ["data/*"]
"aiinvite.recall" = ["data/*"]
"aiinvite.projection" = ["data/*"]
"aiinvite.persona" = ["data/*"]
"aiinvite.kernel" = ["data/*"]
"aiinvite.pcs" = ["data/*"]
