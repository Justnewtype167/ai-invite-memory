[project]
name = "jian"
version = "0.0.1"
description = "Jian: portable memory kernel for AI companions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jian = "jian.cli:main"

[tool.setuptools]
packages = ["jian", "jian_cn", "jian_recall", "jian_kernel", "jian_projection"]

[tool.setuptools.package-data]
jian_cn = ["data/*.json"]
jian_recall = ["data/*.json"]
jian_kernel = []
jian_projection = ["data/*.json"]

